# Supabase project configuration for TechApp. The remote project is selected with `supabase link` (ref is stored
# in supabase/.temp, not here). Local Docker stack is not used in this repo: see supabase/dev/start.mjs.
project_id = "techapp"

[api]
schemas = ["public"]
max_rows = 200

[auth]
# Sign-in is OTP-only (6-digit code, templates/otp.html): no e-mail carries a sign-in link, so no redirect is needed.
# Keep this list empty in every hosted project; never add localhost/127.0.0.1 here (it would be pushed to production).
site_url = "https://techapp.intechne.com.tr"
additional_redirect_urls = []
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

# OTP e-mail. signInWithOtp uses "confirmation" for a new address and "magic_link" for a returning one: both carry the code.
# Custom templates require custom SMTP, which is configured in the Dashboard (Resend, sender no-reply@auth.intechne.com.tr).
# SMTP credentials are deliberately NOT in this file.
[auth.email.template.confirmation]
subject = "TechApp giriş kodun"
content_path = "./supabase/templates/otp.html"

[auth.email.template.magic_link]
subject = "TechApp giriş kodun"
content_path = "./supabase/templates/otp.html"

# Before User Created hook (migration 20261114000100, public.hook_before_user_created): while app.settings.signup_open is
# false only addresses on public.signup_allowlist can get an account. SHIPPED DISABLED on purpose: `config push` sends
# this file to the hosted project, and enabling the hook before the migration is on that project would point Auth at a
# missing function (every new sign-up would fail). Enabling = 🔒 per project, AFTER the migration push:
# set enabled = true → `npx supabase config diff` → user approval → `npx supabase config push` (docs/RELEASE.md).
# The Docker-free local stack (supabase/dev/start.mjs) always applies the same function itself; locally the gate is open.
[auth.hook.before_user_created]
enabled = false
uri = "pg-functions://postgres/public/hook_before_user_created"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Both functions act on behalf of a signed-in user: the platform verifies the JWT before our code runs.
[functions.guardian-dispatch]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
