# Supabase project configuration for TechApp. The remote project is selected with `supabase link` (ref is stored
# in supabase/.temp, not here). Local Docker stack is not used in this repo: see supabase/dev/start.mjs.
project_id = "techapp"

[api]
schemas = ["public"]
max_rows = 200

[auth]
site_url = "techapp://"
additional_redirect_urls = ["techapp://**", "https://techapp.intechne.com.tr/**", "http://localhost:8081/**", "http://127.0.0.1:8081/**"]
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

# OTP e-mail template: supabase/templates/otp.html (must carry {{ .Token }}).
# Supabase only allows custom templates once a custom SMTP provider is configured (free tier + default mailer refuses).
# After SMTP is set up, add these and run `supabase config push`:
#   [auth.email.template.confirmation]  subject = "TechApp giriş kodun"  content_path = "./supabase/templates/otp.html"
#   [auth.email.template.magic_link]    subject = "TechApp giriş kodun"  content_path = "./supabase/templates/otp.html"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Both functions act on behalf of a signed-in user: the platform verifies the JWT before our code runs.
[functions.guardian-dispatch]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
