<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>TechApp · Veli onayı</title>
<style>
  :root{--iris:#4B46D6;--ink:#20241F;--muted:#666D66;--canvas:#F6F7F2;--line:#E3E6DD;--moss:#157461;--moss-soft:#E5F3EB;--danger:#B8323D;--danger-soft:#FFF0F1}
  *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,-apple-system,sans-serif}
  main{max-width:520px;margin:0 auto;padding:32px 20px 64px}h1{font:800 30px/1.17 Manrope,system-ui,sans-serif;letter-spacing:-1px;margin:8px 0 12px}
  .brand{font:800 20px Manrope,system-ui,sans-serif}.brand b{color:var(--iris)}.eyebrow{font-weight:700;font-size:12px;letter-spacing:.8px;color:var(--muted);margin-top:32px}
  .card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:20px 0}.card h2{font:800 18px Manrope,system-ui,sans-serif;margin:0 0 8px}
  .muted{color:var(--muted)}label{display:block;font-weight:600;font-size:14px;margin:20px 0 8px}
  input[type=text]{width:100%;min-height:52px;border:1px solid #D1D7C9;border-radius:14px;padding:0 16px;font:inherit}input[type=text]:focus{outline:2px solid var(--iris);border-color:transparent}
  .check{display:flex;gap:12px;align-items:flex-start;font-weight:400;font-size:14px}.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--iris)}
  button{width:100%;min-height:52px;border-radius:14px;border:1px solid transparent;font:600 15px "DM Sans",system-ui,sans-serif;cursor:pointer;margin-top:12px}
  .primary{background:var(--iris);color:#fff}.secondary{background:#fff;border-color:var(--line);color:var(--ink)}button:disabled{opacity:.45;cursor:default}
  .notice{border-radius:14px;padding:16px;font-size:14px;margin-top:16px}.ok{background:var(--moss-soft);color:var(--moss)}.err{background:var(--danger-soft);color:var(--danger)}
  code{display:block;word-break:break-all;background:#F1F3EB;border-radius:10px;padding:12px;margin-top:8px;font-size:13px}
</style>
</head>
<body>
<main>
  <div class="brand"><b>T.</b> techapp</div>
  <div id="app" aria-live="polite"><p class="muted" style="margin-top:32px">Yükleniyor…</p></div>
</main>
<script>
// Deployed as a static page. The token travels in the URL fragment, so it never reaches server logs or referrers.
const SUPABASE_URL = '__SUPABASE_URL__', PUBLISHABLE_KEY = '__SUPABASE_PUBLISHABLE_KEY__';
const params = location.hash.slice(1).split('&'); const token = params[0] || ''; const revokeMode = params.includes('revoke');
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const date = (iso) => new Date(iso).toLocaleString('tr-TR', { dateStyle: 'long', timeStyle: 'short', timeZone: 'Europe/Istanbul' });
const MESSAGES = {
  guardian_token_invalid: 'Bu bağlantı geçerli değil ya da daha önce kullanılmış.', guardian_request_expired: 'Bu bağlantının süresi dolmuş. Çocuğunuz uygulamadan yeni bir bağlantı gönderebilir.',
  guardian_request_approved: 'Bu istek daha önce onaylanmış.', guardian_request_denied: 'Bu istek daha önce reddedilmiş.', guardian_request_revoked: 'Bu istek geri çekilmiş.',
  guardian_request_expired_: '', guardian_name_required: 'Lütfen adınızı ve soyadınızı yazın.', policy_version_mismatch: 'Onay metni güncellendi. Sayfayı yenileyip tekrar deneyin.',
};
async function rpc(name, args) {
  let res;
  try { res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, { method: 'POST', headers: { apikey: PUBLISHABLE_KEY, 'content-type': 'application/json' }, body: JSON.stringify(args) }); }
  catch { throw new Error('Bağlantı kurulamadı. İnternetinizi kontrol edip tekrar deneyin. İşleminiz kaydedilmedi.'); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(MESSAGES[body.message] || 'İşlem tamamlanamadı. Lütfen daha sonra tekrar deneyin.');
  return body;
}
const fail = (msg) => { app.innerHTML = `<h1 style="margin-top:32px">Devam edilemiyor.</h1><div class="notice err" role="alert">${esc(msg)}</div>`; };

async function start() {
  if (!/^[0-9a-f]{64}$/.test(token)) return fail(MESSAGES.guardian_token_invalid);
  if (revokeMode) return renderRevoke();
  let p; try { p = await rpc('guardian_request_preview', { p_token: token }); } catch (e) { return fail(e.message); }
  app.innerHTML = `
    <div class="eyebrow">VELİ ONAYI</div><h1>${esc(p.participant_first_name)} bir etkinliğe katılmak istiyor.</h1>
    <p class="muted">18 yaşından küçük katılımcılar için bu etkinlikte velinin onayı gerekiyor. Onay yalnızca bu etkinlik için geçerlidir.</p>
    <div class="card"><h2>${esc(p.event.title)}</h2>
      <div class="muted">${esc(date(p.event.starts_at))}</div>
      <div class="muted">${esc([p.event.city, p.event.venue].filter(Boolean).join(' · ') || 'Çevrim içi')}</div>
      <div class="muted">Düzenleyen: ${esc(p.event.organizer)}</div></div>
    <p class="muted" style="font-size:14px">Düzenleyenle paylaşılacak bilgiler: katılımcının adı ve kayıt durumu. Bağlantı ${esc(date(p.expires_at))} tarihine kadar geçerlidir. Onay metni sürümü: ${esc(p.policy_version)}</p>
    <form id="f"><label for="n">Adınız ve soyadınız</label><input id="n" type="text" autocomplete="name" required minlength="5">
      <label class="check"><input id="c" type="checkbox"> <span>Bu katılımcının velisi / yasal temsilcisiyim ve etkinliğe katılımına onay veriyorum.</span></label>
      <div id="m"></div>
      <button class="primary" id="yes" type="submit">Onaylıyorum</button><button class="secondary" id="no" type="button">Onaylamıyorum</button></form>`;
  const decide = async (approve) => {
    const name = document.getElementById('n').value.trim(); const m = document.getElementById('m');
    if (name.length < 5) { m.innerHTML = `<div class="notice err" role="alert">${MESSAGES.guardian_name_required}</div>`; return; }
    if (approve && !document.getElementById('c').checked) { m.innerHTML = '<div class="notice err" role="alert">Onay vermek için kutuyu işaretleyin.</div>'; return; }
    document.querySelectorAll('button').forEach((b) => (b.disabled = true));
    try {
      const r = await rpc('guardian_decide', { p_token: token, p_approve: approve, p_guardian_full_name: name, p_policy_version: p.policy_version });
      app.innerHTML = approve
        ? `<h1 style="margin-top:32px">Onayınız alındı.</h1><div class="notice ok">Katılım kesinleşti. Teşekkür ederiz.</div>
           <p class="muted" style="font-size:14px;margin-top:20px">Fikrinizi değiştirirseniz onayı aşağıdaki bağlantıdan geri çekebilirsiniz. Bu bağlantı yalnızca bir kez gösterilir; lütfen saklayın.</p>
           <code>${esc(location.origin + location.pathname + '#' + r.revoke_token + '&revoke')}</code>`
        : `<h1 style="margin-top:32px">Kararınız kaydedildi.</h1><div class="notice ok">Katılım onaylanmadı ve kayıt iptal edildi.</div>`;
    } catch (e) { m.innerHTML = `<div class="notice err" role="alert">${esc(e.message)}</div>`; document.querySelectorAll('button').forEach((b) => (b.disabled = false)); }
  };
  document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault(); decide(true); });
  document.getElementById('no').addEventListener('click', () => decide(false));
}
function renderRevoke() {
  app.innerHTML = `<div class="eyebrow">VELİ ONAYI</div><h1>Onayı geri çekmek istiyor musunuz?</h1><p class="muted">Katılımcının bu etkinlikteki kaydı iptal edilir.</p><div id="m"></div><button class="primary" id="r">Onayı geri çek</button>`;
  document.getElementById('r').addEventListener('click', async (ev) => {
    ev.target.disabled = true;
    try { await rpc('guardian_revoke', { p_revoke_token: token }); app.innerHTML = '<h1 style="margin-top:32px">Onay geri çekildi.</h1><div class="notice ok">Kayıt iptal edildi.</div>'; }
    catch (e) { document.getElementById('m').innerHTML = `<div class="notice err" role="alert">${esc(e.message)}</div>`; ev.target.disabled = false; }
  });
}
start();
</script>
</body>
</html>
